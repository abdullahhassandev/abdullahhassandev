name: RDP with Ngrok Tunnel and MongoDB
on: [workflow_dispatch]

jobs:
  full-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: Install Chocolatey packages
      run: |
        # Install Chocolatey if not already installed
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Refresh environment variables
        $env:ChocolateyInstall = Convert-Path "$((Get-Command choco).Path)\..\.."   
        Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
        
        # Install MongoDB Community Edition
        choco install mongodb -y --version=6.0.9 --params="'/InstallationType:JustInstall'"
        
        # Install Ngrok
        choco install ngrok -y
        
        # Refresh PATH to ensure ngrok is available
        refreshenv
        
    - name: Configure MongoDB Service
      run: |
        # Create MongoDB data and log directories
        $mongoDataPath = "C:\data\db"
        $mongoLogPath = "C:\data\log"
        
        if (-not (Test-Path $mongoDataPath)) {
            New-Item -Path $mongoDataPath -ItemType Directory -Force
        }
        if (-not (Test-Path $mongoLogPath)) {
            New-Item -Path $mongoLogPath -ItemType Directory -Force
        }
        
        # Configure and start MongoDB service
        Write-Host "Configuring MongoDB service..."
        try {
            # Stop if already running
            Stop-Service -Name "MongoDB" -ErrorAction SilentlyContinue
            
            # Create MongoDB config file
            $configContent = @"
systemLog:
    destination: file
    path: C:\data\log\mongod.log
    logAppend: true
storage:
    dbPath: C:\data\db
net:
    bindIp: 127.0.0.1
    port: 27017
"@
            $configContent | Out-File -FilePath "C:\Program Files\MongoDB\Server\6.0\bin\mongod.cfg" -Encoding utf8
            
            # Start MongoDB service
            Start-Service -Name "MongoDB" -ErrorAction Stop
            Write-Host "✅ MongoDB service started successfully"
            
            # Wait a moment for service to fully start
            Start-Sleep -Seconds 5
            
            # Test MongoDB connection
            & "C:\Program Files\MongoDB\Server\6.0\bin\mongo.exe" --eval "db.version()" --quiet
            if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ MongoDB is running and accessible"
            } else {
                Write-Host "⚠️ MongoDB service might need manual configuration"
            }
            
        } catch {
            Write-Host "❌ Failed to start MongoDB service: $($_.Exception.Message)"
            Write-Host "You may need to manually configure MongoDB after RDP connection"
        }
        
    - name: Create new user for RDP
      run: |
        $username = "github-rdp-user"
        $password = "YourSecurePassword123!"
        
        New-LocalUser -Name $username -Password (ConvertTo-SecureString $password -AsPlainText -Force) -FullName "GitHub RDP User" -Description "Temporary RDP user"
        Add-LocalGroupMember -Group "Administrators" -Member $username
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
        
    - name: Configure RDP settings
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Start required services
      run: |
        Start-Service -Name "TermService" -ErrorAction SilentlyContinue
        Set-Service -Name "TermService" -StartupType Automatic
        
    - name: Configure Ngrok authtoken
      run: |
        # Ensure ngrok is in PATH
        refreshenv
        
        # Configure ngrok authtoken
        ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Start Ngrok tunnels for RDP and MongoDB
      run: |
        # Kill any existing ngrok processes
        Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
        
        # Start ngrok tunnels for RDP (3389) and MongoDB (27017)
        $ngrokProcess = Start-Process -FilePath "ngrok" -ArgumentList "start --none" -PassThru
        
        # Wait for ngrok to start
        Start-Sleep -Seconds 3
        
        # Create ngrok configuration for multiple tunnels
        $ngrokConfig = @"
version: "2"
authtoken: $env:NGROK_AUTH_TOKEN
tunnels:
  rdp:
    proto: tcp
    addr: 3389
  mongodb:
    proto: tcp
    addr: 27017
"@
        
        $ngrokConfig | Out-File -FilePath "$env:USERPROFILE\.ngrok2\ngrok.yml" -Encoding utf8
        
        # Start all tunnels
        Start-Process -FilePath "ngrok" -ArgumentList "start --all" -WindowStyle Hidden
        
        # Wait for tunnels to establish
        Write-Host "Waiting for ngrok tunnels to be established..."
        $tunnelsReady = $false
        $retryCount = 0
        $maxRetries = 20
        
        while (-not $tunnelsReady -and $retryCount -lt $maxRetries) {
            try {
                Start-Sleep -Seconds 3
                $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                
                if ($response.tunnels -and $response.tunnels.Count -ge 2) {
                    $rdpTunnel = $response.tunnels | Where-Object { $_.name -eq "rdp" }
                    $mongoTunnel = $response.tunnels | Where-Object { $_.name -eq "mongodb" }
                    
                    if ($rdpTunnel -and $mongoTunnel) {
                        $tunnelsReady = $true
                        
                        # Parse RDP tunnel info
                        if ($rdpTunnel.public_url -match 'tcp://(.+):(\d+)') {
                            $rdpHostname = $matches[1]
                            $rdpPort = $matches[2]
                        }
                        
                        # Parse MongoDB tunnel info
                        if ($mongoTunnel.public_url -match 'tcp://(.+):(\d+)') {
                            $mongoHostname = $matches[1]
                            $mongoPort = $matches[2]
                        }
                        
                        Write-Host "=========================================="
                        Write-Host "🎉 RDP & MONGODB SUCCESSFULLY SETUP! 🎉"
                        Write-Host "=========================================="
                        Write-Host "📱 RDP CONNECTION:"
                        Write-Host "Public URL: $($rdpTunnel.public_url)"
                        Write-Host "Hostname: $rdpHostname"
                        Write-Host "Port: $rdpPort"
                        Write-Host "Username: github-rdp-user"
                        Write-Host "Password: YourSecurePassword123!"
                        Write-Host ""
                        Write-Host "🗄️  MONGODB CONNECTION:"
                        Write-Host "Public URL: $($mongoTunnel.public_url)"
                        Write-Host "Hostname: $mongoHostname"
                        Write-Host "Port: $mongoPort"
                        Write-Host "Connection String: mongodb://$mongoHostname`:$mongoPort/"
                        Write-Host ""
                        Write-Host "📝 RDP INSTRUCTIONS:"
                        Write-Host "1. Use Remote Desktop Connection"
                        Write-Host "2. Computer: $rdpHostname`:$rdpPort"
                        Write-Host "3. Username: github-rdp-user"
                        Write-Host "4. Password: YourSecurePassword123!"
                        Write-Host ""
                        Write-Host "⚠️  IMPORTANT:"
                        Write-Host "- This session will automatically end after 6 hours"
                        Write-Host "- Do not close this workflow run"
                        Write-Host "=========================================="
                        
                        # Set outputs for future steps
                        echo "RDP_HOSTNAME=$rdpHostname" >> $env:GITHUB_ENV
                        echo "RDP_PORT=$rdpPort" >> $env:GITHUB_ENV
                        echo "MONGO_HOSTNAME=$mongoHostname" >> $env:GITHUB_ENV
                        echo "MONGO_PORT=$mongoPort" >> $env:GITHUB_ENV
                    }
                }
            } catch {
                Write-Host "Waiting for ngrok tunnels to be ready... ($retryCount/$maxRetries)"
                $retryCount++
            }
        }
        
        if (-not $tunnelsReady) {
            Write-Host "❌ Failed to establish ngrok tunnels after $maxRetries attempts"
            exit 1
        }
        
    - name: Keep session alive
      run: |
        Write-Host "RDP and MongoDB sessions are active for 6 hours maximum..."
        Write-Host "Monitoring services status..."
        
        $sessionDuration = 360 # 6 hours in minutes
        for ($i = 0; $i -lt $sessionDuration; $i++) {
            $timeRemaining = ($sessionDuration - $i)
            Write-Host "Session active - $(Get-Date) - Time remaining: $($timeRemaining) minutes"
            
            # Check MongoDB service status
            $mongoStatus = Get-Service -Name "MongoDB" -ErrorAction SilentlyContinue
            if ($mongoStatus.Status -ne "Running") {
                Write-Host "⚠️  MongoDB service is not running. Attempting to restart..."
                try {
                    Start-Service -Name "MongoDB" -ErrorAction Stop
                    Write-Host "✅ MongoDB service restarted"
                } catch {
                    Write-Host "❌ Failed to restart MongoDB: $($_.Exception.Message)"
                }
            }
            
            # Check ngrok tunnel status
            try {
                $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                $activeTunnels = $tunnels.tunnels.Count
                Write-Host "Active ngrok tunnels: $activeTunnels"
            } catch {
                Write-Host "⚠️  Could not check tunnel status: $($_.Exception.Message)"
            }
            
            Start-Sleep -Seconds 60
        }
        
        Write-Host "⏰ Session time limit reached. Shutting down..."
