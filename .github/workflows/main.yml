name: RDP with Ngrok Tunnel
on: [workflow_dispatch]

jobs:
  full-rdp:
    runs-on: windows-latest
    
    steps:
    - name: Create new user for RDP
      run: |
        $username = "github-rdp-user"
        $password = "YourSecurePassword123!"
        
        New-LocalUser -Name $username -Password (ConvertTo-SecureString $password -AsPlainText -Force) -FullName "GitHub RDP User" -Description "Temporary RDP user"
        Add-LocalGroupMember -Group "Administrators" -Member $username
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
        
    - name: Configure RDP settings
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Start required services
      run: |
        Start-Service -Name "TermService"
        Set-Service -Name "TermService" -StartupType Automatic
        
    - name: Download and setup Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -Force
        .\ngrok\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Start Ngrok tunnel
      run: |
        # Start ngrok in background
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log stdout"
        Start-Sleep -Seconds 5
        
    - name: Get Ngrok public URL
      run: |
        # Get the public URL from ngrok API
        $retryCount = 0
        $maxRetries = 10
        do {
            Start-Sleep -Seconds 3
            try {
                $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                $public_url = $tunnels.tunnels[0].public_url
                if ($public_url) {
                    Write-Host "=========================================="
                    Write-Host "🎉 RDP CONNECTION SUCCESSFULLY SETUP! 🎉"
                    Write-Host "=========================================="
                    Write-Host "Public RDP URL: $public_url"
                    Write-Host "Username: github-rdp-user"
                    Write-Host "Password: YourSecurePassword123!"
                    Write-Host ""
                    Write-Host "📝 CONNECTION INSTRUCTIONS:"
                    Write-Host "1. The URL looks like: tcp://X.tcp.ngrok.io:XXXXX"
                    Write-Host "2. Use Remote Desktop Connection"
                    Write-Host "3. Computer: X.tcp.ngrok.io:XXXXX"
                    Write-Host "4. Username: github-rdp-user"
                    Write-Host "5. Password: YourSecurePassword123!"
                    Write-Host "=========================================="
                    break
                }
            } catch {
                Write-Host "Waiting for ngrok tunnel to be ready... ($retryCount/$maxRetries)"
            }
            $retryCount++
        } while ($retryCount -lt $maxRetries)
        
    - name: Keep session alive
      run: |
        Write-Host "RDP session is active for 6 hours maximum..."
        # Ping every minute to keep alive
        for ($i = 0; $i -lt 360; $i++) {
            Write-Host "Session active - $(Get-Date) - Time remaining: $((360 - $i)*60) seconds"
            Start-Sleep -Seconds 60
        }
